<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note - Wenhao Liu</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<link rel="stylesheet" href="style.css">

<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>

<body>
<section class="top" role="banner">
  <header>
    <h1>
      <a href="index.html">Wenhao Liu's Blog</a>
    </h1>
  </header>

  <nav aria-label="Primary navigation">
    <ul>
      <li><a href="index.html">Posts</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>
</section>

<main class="content article-shell">
  <a class="back-link" href="index.html">← All posts</a>
  <article id="article" class="article">
    <p class="muted">Loading note...</p>
  </article>
  <p class="article-footer-link"><a href="index.html">← Back to all posts</a></p>
</main>

<script>
const article = document.getElementById("article");

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getSource() {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get("src");

  if (!raw) return null;

  let src = raw.trim();

  try {
    src = decodeURIComponent(src);
  } catch (_) {
    return null;
  }

  const invalid =
    src.includes("://") ||
    src.startsWith("/") ||
    src.includes("..") ||
    src.includes("\\") ||
    !src.toLowerCase().endsWith(".md");

  return invalid ? null : src;
}

function slugify(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/<[^>]*>/g, "")
    .replace(/[^\w\u4e00-\u9fa5]+/g, "-")
    .replace(/^-+|-+$/g, "") || "section";
}

function titleFromMarkdown(markdown, fallback) {
  const heading =
    markdown.match(/^#\s+(.+)$/m) ||
    markdown.match(/^##\s+(.+)$/m) ||
    markdown.match(/^###\s+(.+)$/m);

  return heading ? heading[1].replace(/[*_`$]/g, "").trim() : fallback;
}

function extractSpecialBlocks(markdown) {
  const mathStore = [];
  const codeStore = [];
  const mermaidStore = [];

  function saveCode(code) {
    const id = codeStore.length;
    codeStore.push(code);
    return `@@CODE_PLACEHOLDER_${id}@@`;
  }

  function saveMath(content, display) {
    const id = mathStore.length;
    mathStore.push({ content, display });
    return display ? `\n\n@@MATH_BLOCK_${id}@@\n\n` : `@@MATH_INLINE_${id}@@`;
  }

  function saveMermaid(content) {
    const id = mermaidStore.length;
    mermaidStore.push(content);
    return `\n\n@@MERMAID_BLOCK_${id}@@\n\n`;
  }

  let text = markdown;

  // Mermaid fenced code blocks must be extracted before normal code blocks.
  text = text.replace(/```mermaid\s*([\s\S]*?)```/gi, (_, content) => {
    return saveMermaid(content.trim());
  });

  text = text.replace(/~~~mermaid\s*([\s\S]*?)~~~/gi, (_, content) => {
    return saveMermaid(content.trim());
  });

  // Avoid parsing math delimiters inside code blocks or inline code.
  text = text.replace(/```[\s\S]*?```|~~~[\s\S]*?~~~/g, saveCode);
  text = text.replace(/`[^`\n]+`/g, saveCode);

  // Protect display math before Markdown parsing.
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, (_, content) => {
    return saveMath(content.trim(), true);
  });

  text = text.replace(/\\\[([\s\S]+?)\\\]/g, (_, content) => {
    return saveMath(content.trim(), true);
  });

  // Protect inline math. This intentionally does not match across newlines.
  text = text.replace(/(^|[^\\\w])\$([^$\n]+?)\$(?!\w)/g, (match, prefix, content) => {
    const trimmed = content.trim();
    if (!trimmed) return match;
    return `${prefix}${saveMath(trimmed, false)}`;
  });

  text = text.replace(/\\\((.+?)\\\)/g, (_, content) => {
    return saveMath(content.trim(), false);
  });

  text = text.replace(/@@CODE_PLACEHOLDER_(\d+)@@/g, (_, index) => {
    return codeStore[Number(index)] || "";
  });

  return {
    text,
    mathStore,
    mermaidStore
  };
}

function restoreSpecialBlocks(html, mathStore, mermaidStore) {
  let restored = html;

  restored = restored.replace(/@@MATH_BLOCK_(\d+)@@/g, (_, index) => {
    const item = mathStore[Number(index)];
    if (!item) return "";
    return `<div class="math-display">$$${escapeHtml(item.content)}$$</div>`;
  });

  restored = restored.replace(/@@MATH_INLINE_(\d+)@@/g, (_, index) => {
    const item = mathStore[Number(index)];
    if (!item) return "";
    return `<span class="math-inline">$${escapeHtml(item.content)}$</span>`;
  });

  restored = restored.replace(/@@MERMAID_BLOCK_(\d+)@@/g, (_, index) => {
    const content = mermaidStore[Number(index)];
    if (!content) return "";

    return `
      <div class="mermaid-wrapper">
        <div class="mermaid">${escapeHtml(content)}</div>
      </div>
    `;
  });

  return restored;
}

function withRelativeAssets(html, source) {
  const base = source.includes("/") ? source.slice(0, source.lastIndexOf("/") + 1) : "";
  const doc = new DOMParser().parseFromString(html, "text/html");

  doc.querySelectorAll("img").forEach(img => {
    const src = img.getAttribute("src") || "";

    if (
      src &&
      !src.includes("://") &&
      !src.startsWith("/") &&
      !src.startsWith("data:")
    ) {
      img.setAttribute("src", base + src);
    }

    img.loading = "lazy";
    img.decoding = "async";
  });

  doc.querySelectorAll("a").forEach(link => {
    const href = link.getAttribute("href") || "";

    if (
      href &&
      !href.includes("://") &&
      !href.startsWith("#") &&
      !href.startsWith("/") &&
      !href.startsWith("mailto:")
    ) {
      link.setAttribute("href", base + href);
    }

    if (href.includes("://")) {
      link.target = "_blank";
      link.rel = "noopener noreferrer";
    }
  });

  return doc.body.innerHTML;
}

function sanitizeArticleHtml(html) {
  if (!window.DOMPurify) return html;

  return DOMPurify.sanitize(html, {
    USE_PROFILES: { html: true },
    ADD_ATTR: [
      "target",
      "rel",
      "loading",
      "decoding",
      "class",
      "id",
      "aria-label"
    ]
  });
}

function addHeadingAnchors() {
  const headings = article.querySelectorAll("h1, h2, h3, h4");
  const usedIds = new Map();

  headings.forEach(heading => {
    const text = heading.textContent.trim();
    let id = slugify(text);

    const count = usedIds.get(id) || 0;
    usedIds.set(id, count + 1);

    if (count > 0) {
      id = `${id}-${count + 1}`;
    }

    heading.id = id;

    const anchor = document.createElement("a");
    anchor.className = "heading-anchor";
    anchor.href = `#${id}`;
    anchor.textContent = "#";
    anchor.setAttribute("aria-label", `Link to ${text}`);

    heading.appendChild(anchor);
  });
}

function headingText(heading) {
  const clone = heading.cloneNode(true);
  clone.querySelectorAll(".heading-anchor").forEach(anchor => anchor.remove());
  return clone.textContent.trim();
}

function addTableOfContents() {
  const headings = Array.from(article.querySelectorAll("h2, h3"))
    .filter(heading => heading.id && headingText(heading));

  if (headings.length < 3) {
    return;
  }

  const nav = document.createElement("nav");
  nav.className = "article-toc";
  nav.setAttribute("aria-label", "Table of contents");

  const title = document.createElement("div");
  title.className = "article-toc-title";
  title.textContent = "Contents";

  const list = document.createElement("ul");

  headings.forEach(heading => {
    const item = document.createElement("li");
    item.className = `toc-${heading.tagName.toLowerCase()}`;

    const link = document.createElement("a");
    link.href = `#${heading.id}`;
    link.textContent = headingText(heading);

    item.appendChild(link);
    list.appendChild(item);
  });

  nav.appendChild(title);
  nav.appendChild(list);

  const firstHeading = article.querySelector("h1");
  if (firstHeading && firstHeading.nextSibling) {
    firstHeading.parentNode.insertBefore(nav, firstHeading.nextSibling);
  } else {
    article.insertBefore(nav, article.firstChild);
  }
}

function highlightCode() {
  if (!window.hljs || typeof window.hljs.highlightElement !== "function") {
    return;
  }

  article.querySelectorAll("pre code").forEach(block => {
    if (block.dataset.highlighted === "yes") return;

    try {
      window.hljs.highlightElement(block);
    } catch (error) {
      console.warn("Code highlight failed:", error);
    }
  });
}

function addCodeCopyButtons() {
  article.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector(".copy-code-button")) return;

    const code = pre.querySelector("code");
    if (!code) return;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "copy-code-button";
    button.textContent = "Copy";

    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(code.innerText);

        button.classList.add("copied");
        button.textContent = "Copied";

        window.setTimeout(() => {
          button.classList.remove("copied");
          button.textContent = "Copy";
        }, 1200);
      } catch (_) {
        button.textContent = "Failed";

        window.setTimeout(() => {
          button.textContent = "Copy";
        }, 1200);
      }
    });

    pre.appendChild(button);
  });
}

function wrapTables() {
  article.querySelectorAll("table").forEach(table => {
    if (
      table.parentElement &&
      table.parentElement.classList.contains("table-wrap")
    ) {
      return;
    }

    const wrapper = document.createElement("div");
    wrapper.className = "table-wrap";
    table.parentNode.insertBefore(wrapper, table);
    wrapper.appendChild(table);
  });
}

async function renderMermaid() {
  if (!window.mermaid) return;

  window.mermaid.initialize({
    startOnLoad: false,
    securityLevel: "strict",
    theme: "neutral",
    fontFamily: "Inter, Noto Sans SC, sans-serif"
  });

  const blocks = article.querySelectorAll(".mermaid");

  for (const block of blocks) {
    const source = block.textContent.trim();
    if (!source) continue;

    const id = `mermaid-${Math.random().toString(36).slice(2)}`;

    try {
      const { svg } = await window.mermaid.render(id, source);
      block.innerHTML = svg;
    } catch (error) {
      console.warn("Mermaid render failed:", error);
      block.innerHTML = `<pre><code>${escapeHtml(source)}</code></pre>`;
    }
  }
}

function renderMath() {
  if (typeof window.renderMathInElement !== "function") {
    return;
  }

  renderMathInElement(article, {
    delimiters: [
      { left: "$$", right: "$$", display: true },
      { left: "$", right: "$", display: false },
      { left: "\\[", right: "\\]", display: true },
      { left: "\\(", right: "\\)", display: false }
    ],
    ignoredTags: [
      "script",
      "noscript",
      "style",
      "textarea",
      "pre",
      "code"
    ],
    throwOnError: false,
    strict: false,
    trust: false,
    macros: {
      "\\bm": "\\boldsymbol{#1}",
      "\\argmax": "\\operatorname*{arg\\,max}",
      "\\argmin": "\\operatorname*{arg\\,min}"
    }
  });
}

function configureMarked() {
  if (!window.marked) {
    throw new Error("Marked is not loaded. Please check the CDN connection.");
  }

  marked.setOptions({
    gfm: true,
    breaks: false,
    mangle: false,
    headerIds: false
  });
}

async function renderMarkdown() {
  const source = getSource();

  if (!source) {
    article.innerHTML = "<p class=\"muted\">Missing or invalid note source.</p>";
    return;
  }

  try {
    configureMarked();

    const response = await fetch(source, { cache: "no-cache" });

    if (!response.ok) {
      throw new Error(`Cannot load note: ${response.status} ${response.statusText}`);
    }

    const markdown = await response.text();

    const fallbackTitle = source
      .split("/")
      .pop()
      .replace(/\.md$/i, "")
      .replace(/[_-]/g, " ");

    document.title = `${titleFromMarkdown(markdown, fallbackTitle)} - Wenhao Liu`;

    const {
      text: protectedMarkdown,
      mathStore,
      mermaidStore
    } = extractSpecialBlocks(markdown);

    const rawHtml = marked.parse(protectedMarkdown);
    const htmlWithSpecialBlocks = restoreSpecialBlocks(
      rawHtml,
      mathStore,
      mermaidStore
    );
    const htmlWithAssets = withRelativeAssets(htmlWithSpecialBlocks, source);

    article.innerHTML = sanitizeArticleHtml(htmlWithAssets);

    addHeadingAnchors();
    addTableOfContents();
    await renderMermaid();
    renderMath();
    highlightCode();
    addCodeCopyButtons();
    wrapTables();

  } catch (error) {
    console.error(error);

    article.innerHTML = `
      <p class="muted">This note could not be loaded.</p>
      <pre><code>${escapeHtml(String(error))}</code></pre>
    `;
  }
}

window.addEventListener("DOMContentLoaded", renderMarkdown);
</script>
</body>
</html>
